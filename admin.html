<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة | ملوك النت في مصر</title>
<style>
:root{--navy:#10283d;--navy2:#173b59;--bg:#f3f6f9;--line:#e5ebf0;--text:#182532;--muted:#70808e;--white:#fff;--green:#168a55;--orange:#c77b00;--red:#c33b3b;--blue:#246fae}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Tahoma",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{padding:8px 10px 22px;border-bottom:1px solid #ffffff1c}.brand b{font-size:21px}.brand small{display:block;color:#b9c8d4;margin-top:7px}.nav{margin-top:22px}.nav a{display:block;color:#dbe6ee;text-decoration:none;padding:13px 12px;border-radius:12px;margin:5px 0}.nav a.active,.nav a:hover{background:#ffffff12;color:#fff}.side .logout{margin-top:25px;width:100%;background:#fff;color:var(--navy);border:0;padding:12px;border-radius:12px;font-weight:700;cursor:pointer}.main{flex:1;padding:24px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.head h1{margin:0;font-size:27px}.head p{margin:6px 0 0;color:var(--muted)}.head-actions{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:700}.danger{background:#c62828;color:#fff}.primary{background:var(--navy);color:#fff}.light{background:#fff;border:1px solid var(--line);color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 18px #10283d08}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:26px;font-weight:800;margin-top:7px}.stat.total .num{color:var(--navy)}.stat.pending .num{color:var(--orange)}.stat.progress .num{color:var(--blue)}.stat.done .num{color:var(--green)}.stat.rejected .num{color:var(--red)}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:17px;box-shadow:0 5px 18px #10283d08}.tools{display:grid;grid-template-columns:1.5fr .8fr .8fr auto;gap:9px}.tools input,.tools select{width:100%;padding:12px;border:1px solid #d9e2e8;border-radius:11px;background:#fff;outline:none}.tools input:focus,.tools select:focus{border-color:#7897ad}.hint{font-size:12px;color:var(--muted);margin-top:9px}.orders-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.orders-title h2{margin:0;font-size:18px}.orders-title span{color:var(--muted);font-size:13px}.order{border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;background:#fbfcfd}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.order-no{font-size:18px;font-weight:800;color:var(--navy)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.pending{background:#fff1c9;color:#8a5b00}.progress{background:#e3f1fc;color:#1d679e}.done{background:#def6e8;color:#147548}.rejected{background:#ffe1e1;color:#a52e2e}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.detail{background:#fff;border:1px solid #edf1f4;border-radius:11px;padding:10px}.detail span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.detail strong{font-size:14px;word-break:break-word}.manage{display:grid;grid-template-columns:1fr 2fr auto;gap:9px;margin-top:12px}.manage select,.manage textarea{border:1px solid #d9e2e8;border-radius:10px;padding:10px;background:#fff}.manage textarea{resize:vertical;min-height:42px}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3f7,#f8fafb);padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 15px 45px #10283d14}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted);margin-top:0}.login-card input{width:100%;padding:13px;border:1px solid #d9e2e8;border-radius:11px;margin:7px 0;outline:none}.login-card button{width:100%;margin-top:8px}.err{display:none;color:var(--red);font-size:13px;margin-top:9px}.toast{position:fixed;left:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:20}.view{background:#eef5fa;color:var(--navy);border:1px solid #d5e2eb}.modal{position:fixed;inset:0;background:#10283d66;display:none;align-items:center;justify-content:center;padding:16px;z-index:15}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px #10283d2e;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:15px}.modal-head h2{margin:0;font-size:22px}.close{border:0;background:#eef2f5;color:var(--navy);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px}.modal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.timeline{margin-top:18px}.timeline h3{margin:0 0 10px}.event{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f4}.event:last-child{border-bottom:0}.dot{width:10px;height:10px;border-radius:50%;background:var(--navy);margin-top:6px;flex:0 0 auto}.event b{display:block}.event small{color:var(--muted);display:block;margin-top:3px}.modal-note{margin-top:15px;background:#f6f9fb;border:1px solid #e6edf2;border-radius:12px;padding:12px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.details{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.tools .refresh{grid-column:span 2}.side{width:210px}}
@media(max-width:720px){.app{display:block}.side{position:static;width:100%;height:auto;padding:12px}.brand{padding:8px 6px 12px}.nav{display:flex;gap:5px;overflow:auto;margin:10px 0 0}.nav a{white-space:nowrap;margin:0}.side .logout{margin-top:8px}.main{padding:13px}.head{align-items:flex-start}.head h1{font-size:22px}.head-actions{display:none}.stats{grid-template-columns:repeat(2,1fr)}.stat.total{grid-column:span 2}.tools{grid-template-columns:1fr}.tools .refresh{grid-column:auto}.details{grid-template-columns:1fr 1fr}.manage{grid-template-columns:1fr}.order-top{align-items:flex-start;flex-direction:column}.modal-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div><div class="toast" id="toast"></div>
<div class="modal" id="detailsModal"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">تفاصيل العملية</h2><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div><script>
(function(){
const root=document.getElementById('root');
const TOKEN_KEY='molookAdminToken';
async function api(path,opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  const token=sessionStorage.getItem(TOKEN_KEY);
  if(token) headers['Authorization']='Bearer '+token;
  const r=await fetch(path,{...opts,headers});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'حدث خطأ في الاتصال');
  return data;
}
function esc(v){return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function statusClass(s){return s==='تم التنفيذ'?'done':s==='جاري التنفيذ'?'progress':s==='مرفوض'?'rejected':'pending'}
function badge(s){return `<span class="badge ${statusClass(s)}">${esc(s||'قيد المراجعة')}</span>`}
function serviceName(o){return o.service||o.type||'طلب خدمة'}
function orderDate(o){if(!o.createdAt)return '—';const d=new Date(o.createdAt);return isNaN(d)?'—':d.toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}
function eventDate(x){if(!x)return '—';const d=new Date(x);return isNaN(d)?'—':d.toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.style.display='none',2200)}

async function loginScreen(){
 root.innerHTML=`<div class="login"><div class="login-card"><h1>🔐 دخول الإدارة</h1><p>لوحة الإدارة الخاصة بمنصة ملوك النت في مصر</p><input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="btn primary" id="login">دخول لوحة الإدارة</button><div class="err" id="err"></div></div></div>`;
 document.getElementById('login').onclick=async()=>{
   const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
   try{
     const data=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
     sessionStorage.setItem(TOKEN_KEY,data.token); sessionStorage.setItem('molookAdmin','1'); location.reload();
   }catch(e){document.getElementById('err').textContent=e.message||'بيانات الدخول غير صحيحة.';document.getElementById('err').style.display='block'}
 };
}

let all=[];
async function load(){const data=await api('/api/orders');all=data.orders||[];render()}
function stats(a){return {total:a.length,pending:a.filter(o=>(o.status||'قيد المراجعة')==='قيد المراجعة').length,progress:a.filter(o=>o.status==='جاري التنفيذ').length,done:a.filter(o=>o.status==='تم التنفيذ').length,rejected:a.filter(o=>o.status==='مرفوض').length}}
function ensureHistory(o){if(!Array.isArray(o.history)||!o.history.length)o.history=[{status:o.status||'قيد المراجعة',at:o.createdAt||new Date().toISOString(),note:o.note||'تم إنشاء الطلب'}];return o}

function render(){
 const s=stats(all),q=(document.getElementById('q')?.value||'').trim(),fs=document.getElementById('fs')?.value||'',fn=document.getElementById('fn')?.value||'';
 const list=all.filter(o=>{const hay=[o.orderNo,o.phone,o.network,o.packageName,serviceName(o)].join(' ').toLowerCase();return(!q||hay.includes(q.toLowerCase()))&&(!fs||((o.status||'قيد المراجعة')===fs))&&(!fn||serviceName(o)===fn)});
 document.getElementById('stats').innerHTML=`<div class="stat total"><div class="label">إجمالي العمليات</div><div class="num">${s.total}</div></div><div class="stat pending"><div class="label">قيد المراجعة</div><div class="num">${s.pending}</div></div><div class="stat progress"><div class="label">جاري التنفيذ</div><div class="num">${s.progress}</div></div><div class="stat done"><div class="label">تم التنفيذ</div><div class="num">${s.done}</div></div><div class="stat rejected"><div class="label">مرفوض</div><div class="num">${s.rejected}</div></div>`;
 document.getElementById('count').textContent=`عرض ${list.length} من ${all.length} عملية`;
 document.getElementById('orders').innerHTML=list.length?list.map(o=>`<div class="order" data-id="${esc(o.orderNo||o.id)}"><div class="order-top"><div class="order-no"># ${esc(o.orderNo||o.id)}</div>${badge(o.status)}</div><div class="details"><div class="detail"><span>رقم الهاتف</span><strong>${esc(o.phone)}</strong></div><div class="detail"><span>الخدمة</span><strong>${esc(serviceName(o))}</strong></div><div class="detail"><span>الشبكة</span><strong>${esc(o.network)}</strong></div><div class="detail"><span>الباقة / الكارت</span><strong>${esc(o.packageName)}</strong></div><div class="detail"><span>القيمة</span><strong>${esc(o.price)}</strong></div><div class="detail"><span>التفاصيل</span><strong>${esc(o.units)}</strong></div><div class="detail"><span>الصلاحية</span><strong>${esc(o.validity)}</strong></div><div class="detail"><span>وقت الطلب</span><strong>${orderDate(o)}</strong></div></div><div class="manage"><select class="st">${['قيد المراجعة','جاري التنفيذ','تم التنفيذ','مرفوض'].map(x=>`<option ${x===(o.status||'قيد المراجعة')?'selected':''}>${x}</option>`).join('')}</select><textarea class="note" placeholder="أضف ملاحظة للطلب">${esc(o.note||'')}</textarea><button class="btn primary save">حفظ التحديث</button><button class="btn view details-btn">👁️ تفاصيل العملية</button><button class="btn danger delete">🗑️ حذف العملية</button></div></div>`).join(''):`<div class="empty">📭 لا توجد طلبات مطابقة للبحث أو الفلاتر الحالية.</div>`;
}

root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>👑 ملوك النت في مصر</b><small>لوحة الإدارة</small></div><nav class="nav"><a class="active" href="#orders">📋 الطلبات</a><a href="#stats">📊 الإحصائيات</a></nav><button class="logout" id="logout">تسجيل الخروج</button></aside><main class="main"><div class="head"><div><h1>لوحة الإدارة</h1><p>إدارة ومتابعة جميع طلبات العملاء من مكان واحد.</p></div><div class="head-actions"><button class="btn light" id="refresh">↻ تحديث البيانات</button></div></div><div class="stats" id="stats"></div><section class="panel"><div class="tools"><input id="q" placeholder="🔎 ابحث برقم العملية أو الهاتف أو الشبكة"><select id="fs"><option value="">كل الحالات</option><option>قيد المراجعة</option><option>جاري التنفيذ</option><option>تم التنفيذ</option><option>مرفوض</option></select><select id="fn"><option value="">كل الخدمات</option><option>شحن رصيد</option><option>تجديد باقة</option><option>شحن كروت فكة</option></select><button class="btn light refresh" id="clear">مسح الفلاتر</button></div><div class="hint">البيانات الآن محفوظة في قاعدة بيانات الخادم، وليست داخل متصفح العميل.</div></section><section class="panel"><div class="orders-title"><h2>طلبات العملاء</h2><span id="count"></span></div><div id="orders"></div></section></main></div>`;

 async function saveOrder(o,card){
   const old=o.status||'قيد المراجعة', ns=card.querySelector('.st').value, note=card.querySelector('.note').value.trim();
   const data=await api('/api/orders/'+encodeURIComponent(o.orderNo),{method:'PATCH',body:JSON.stringify({status:ns,note})});
   o= data.order;
   const i=all.findIndex(x=>String(x.orderNo)===String(o.orderNo)); if(i>=0)all[i]=o; render(); showToast('تم حفظ تحديث الطلب');
 }
 async function deleteOrder(o){
   if(!confirm(`هل أنت متأكد من حذف العملية رقم ${o.orderNo}؟\n\nسيتم حذف الطلب نهائيًا من قاعدة البيانات.`))return;
   await api('/api/orders/'+encodeURIComponent(o.orderNo),{method:'DELETE'});
   all=all.filter(x=>String(x.orderNo)!==String(o.orderNo)); render(); showToast('تم حذف العملية بنجاح');
 }
 document.getElementById('orders').addEventListener('click',async e=>{
   const card=e.target.closest('.order');if(!card)return;const no=card.dataset.id,o=all.find(x=>String(x.orderNo||x.id)===String(no));if(!o)return;
   try{
    if(e.target.classList.contains('save'))await saveOrder(o,card);
    else if(e.target.classList.contains('delete'))await deleteOrder(o);
    else if(e.target.classList.contains('details-btn'))openDetails(o);
   }catch(err){showToast(err.message||'تعذر تنفيذ العملية')}
 });
 function openDetails(o){
   ensureHistory(o);
   document.getElementById('modalTitle').textContent=`تفاصيل العملية #${o.orderNo}`;
   document.getElementById('modalBody').innerHTML=`<div class="modal-grid"><div class="detail"><span>رقم العملية</span><strong>${esc(o.orderNo)}</strong></div><div class="detail"><span>الحالة الحالية</span><strong>${esc(o.status||'قيد المراجعة')}</strong></div><div class="detail"><span>رقم الهاتف</span><strong>${esc(o.phone)}</strong></div><div class="detail"><span>الشبكة</span><strong>${esc(o.network)}</strong></div><div class="detail"><span>الخدمة</span><strong>${esc(serviceName(o))}</strong></div><div class="detail"><span>الباقة / الكارت</span><strong>${esc(o.packageName)}</strong></div><div class="detail"><span>القيمة</span><strong>${esc(o.price)}</strong></div><div class="detail"><span>التفاصيل</span><strong>${esc(o.units)}</strong></div><div class="detail"><span>الصلاحية</span><strong>${esc(o.validity)}</strong></div><div class="detail"><span>تاريخ إنشاء الطلب</span><strong>${esc(orderDate(o))}</strong></div></div><div class="modal-note"><b>📝 ملاحظة الإدارة</b><div style="margin-top:6px">${esc(o.note||'لا توجد ملاحظات')}</div></div><div class="timeline"><h3>🕐 سجل حركة العملية</h3>${(o.history||[]).slice().reverse().map(x=>`<div class="event"><span class="dot"></span><div><b>${esc(x.status||'تحديث')}</b><small>${esc(eventDate(x.at))}</small><div style="margin-top:4px">${esc(x.note||'—')}</div></div></div>`).join('')}</div>`;
   document.getElementById('detailsModal').classList.add('show');
 }
 document.getElementById('q').oninput=render;document.getElementById('fs').onchange=render;document.getElementById('fn').onchange=render;
 document.getElementById('refresh').onclick=async()=>{try{await load();showToast('تم تحديث البيانات')}catch(e){showToast(e.message)}};
 document.getElementById('clear').onclick=()=>{document.getElementById('q').value='';document.getElementById('fs').value='';document.getElementById('fn').value='';render()};
 document.getElementById('logout').onclick=()=>{sessionStorage.removeItem(TOKEN_KEY);sessionStorage.removeItem('molookAdmin');location.reload()};
 document.getElementById('modalClose').onclick=()=>document.getElementById('detailsModal').classList.remove('show');
 document.getElementById('detailsModal').addEventListener('click',e=>{if(e.target.id==='detailsModal')e.currentTarget.classList.remove('show')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('detailsModal').classList.remove('show')});
 load().catch(e=>{document.getElementById('orders').innerHTML='<div class="empty">تعذر الاتصال بالخادم: '+esc(e.message)+'</div>'});
}

if(!sessionStorage.getItem(TOKEN_KEY)){loginScreen()}else{
 root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>👑 ملوك النت في مصر</b><small>لوحة الإدارة</small></div></aside><main class="main"><div class="empty">جارٍ تحميل لوحة الإدارة...</div></main></div>`;
 // Replace placeholder with real app shell by reloading into the main renderer.
 setTimeout(()=>{location.reload()},0);
}
})();
</script></body></html>
